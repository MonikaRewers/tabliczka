<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabliczka">
<meta name="author" content="2026@mrevers">
<meta name="description" content="Nauka tabliczki mnożenia i dzielenia dla dzieci 6–12 lat.">
<title>Wycinankowa Tabliczka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Chakra+Petch:wght@600;700&family=Nunito:wght@600;800&display=swap">
<style>

/* Layout: one-screen app built from layered cut paper; folk paper-cut (wycinanka) rosettes as rewards. */
:root{
  --paper:#0f7b4a;      /* ground: deep folk green paper */
  --sheet:#fffaf0;      /* card paper */
  --ink:#1d1b2e;
  --red:#e8293f; --pink:#ff4fa3; --yellow:#ffc928; --blue:#2f6cf6; --violet:#7b3fe4; --orange:#ff7a1a; --mint:#22c58b;
  --shadow:#0a4f30;
  --muted:#6b6880;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:22px;
  color-scheme:light;
}
body[data-style="mistrz"]{
  --paper:#16163a; --sheet:#232352; --ink:#f4f2ff; --shadow:#07071c; --muted:#a9a6d6;
  --r:12px;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --red:#ff3860; --blue:#3d7bff; --violet:#9b5cff; --orange:#ff8a1f;
}
body[data-style="mistrz"] .mode{background-image:linear-gradient(135deg,rgba(255,255,255,.18),transparent 55%);box-shadow:0 0 0 2px rgba(255,255,255,.14) inset,0 6px 0 var(--shadow)}
body[data-style="mistrz"] .mode b{text-transform:uppercase;letter-spacing:.04em;font-size:1.15rem}
body[data-style="mistrz"] .pop .praise{transform:skewX(-8deg);text-transform:uppercase;letter-spacing:.06em;color:var(--yellow)}
body[data-style="mistrz"] .scallop{display:none}
.rank{display:inline-block;margin-top:2px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);font-family:var(--body)}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:600;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.08) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.06) 0 2px,transparent 3px);
  background-size:38px 38px,52px 52px;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(14px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}

/* cut-paper card: hard offset shadow + scalloped top edge */
.sheet{background:var(--sheet);border-radius:var(--r);box-shadow:0 6px 0 var(--shadow);padding:16px;position:relative}
.scallop{--c:var(--sheet);height:14px;margin:-14px 0 0;background:radial-gradient(circle at 10px 14px,var(--c) 9px,transparent 10px) 0 0/20px 14px repeat-x}
.top{display:flex;align-items:center;gap:10px;color:#fff}
.top h1{font-size:1.6rem;flex:1}
.top .who{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);border-radius:999px;padding:4px 12px 4px 4px;font-weight:800}
.back{background:rgba(0,0,0,.2);color:#fff;border-radius:999px;width:44px;height:44px;font-size:1.4rem}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{border-radius:var(--r);padding:16px 12px 14px;color:#fff;text-align:left;box-shadow:0 6px 0 var(--shadow);position:relative;overflow:hidden;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;transition:transform .12s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.mode b{font-family:var(--display);font-size:1.35rem;line-height:1}
.mode small{opacity:.92;font-size:.85rem}
.mode .sym{position:absolute;top:-10px;right:-4px;font-family:var(--display);font-size:5.2rem;opacity:.28;font-weight:800}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.extra{background:var(--sheet);border-radius:var(--r);box-shadow:0 5px 0 var(--shadow);padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.9rem}
.extra svg{width:46px;height:46px}

/* game */
.hud{display:flex;gap:8px;align-items:center;color:#fff;font-weight:800}
.pill{background:rgba(0,0,0,.22);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.progress{flex:1;height:12px;background:rgba(0,0,0,.22);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .3s}
.q{text-align:center;padding:26px 10px 18px}
.q .expr{font-family:var(--display);font-size:clamp(2.8rem,14vw,4.4rem);font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.q .ans{display:inline-block;min-width:2.2ch;border-bottom:6px dashed var(--pink);color:var(--pink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{background:var(--sheet);border-radius:calc(var(--r) - 4px);box-shadow:0 5px 0 var(--shadow);font-family:var(--display);font-size:1.9rem;font-weight:800;height:62px;font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.key.ok{background:var(--yellow);color:#1d1b2e}
.key.del{background:var(--pink);color:#fff}

/* feedback overlay */
.pop{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20}
.pop .card{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.pop .praise{font-family:var(--display);font-size:2.4rem;font-weight:800;color:#fff;text-shadow:0 4px 0 var(--shadow);transform:rotate(-4deg)}
.rosette{width:170px;height:170px;position:relative;display:grid;place-items:center}
.rosette svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 6s linear infinite}
.rosette .animal{font-size:4.2rem;position:relative;animation:hop .9s ease-in-out infinite}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}

/* fact family triangle */
.family{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.family svg{width:200px;height:170px}
.family p{margin:0;font-size:1.15rem;line-height:1.4}
.big{width:100%;border-radius:var(--r);padding:16px;font-family:var(--display);font-size:1.4rem;font-weight:800;background:var(--yellow);color:#1d1b2e;box-shadow:0 6px 0 var(--shadow)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.big.alt{background:var(--sheet);color:var(--ink)}

/* results */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.score{font-family:var(--display);font-size:3.6rem;font-weight:800;color:var(--pink);font-variant-numeric:tabular-nums}
.record{background:var(--yellow);color:#1d1b2e;border-radius:999px;padding:6px 16px;font-weight:800;transform:rotate(-3deg)}

/* zoo */
.zoo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{aspect-ratio:1;max-width:100%;position:relative;display:grid;place-items:center}
.slot svg{position:absolute;inset:0;width:100%;height:100%}
.slot span{position:relative;font-size:1.9rem}
.slot.locked span{filter:brightness(0) opacity(.35);font-size:1.6rem}

/* mastery map */
.mapwrap{overflow-x:auto}
.map{display:grid;grid-template-columns:20px repeat(10,minmax(0,1fr));gap:2px;font-variant-numeric:tabular-nums}
.map div{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;font-size:.66rem;font-weight:800;min-width:0}
.map .h{color:var(--muted);font-family:var(--display);font-size:.9rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.lv0{background:rgba(127,127,160,.18);color:var(--muted)} .lv1{background:#ff8a9a;color:#5a0010} .lv2{background:#ffb36b;color:#5a2a00}
.lv3{background:#ffe066;color:#4d3b00} .lv4{background:#5fdca8;color:#003d26} .lv5{background:linear-gradient(135deg,#ffd23f,#ffb000);color:#4d2f00;box-shadow:inset 0 0 0 2px #fff6}

/* records */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sheet);border-radius:var(--r);box-shadow:0 5px 0 var(--shadow);padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:2rem;color:var(--blue);font-variant-numeric:tabular-nums}
body[data-style="mistrz"] .stat b{color:var(--yellow)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:2px dashed rgba(127,127,160,.3);font-variant-numeric:tabular-nums}
.hist li:last-child{border:0}

/* profiles */
.profiles{display:flex;flex-direction:column;gap:10px}
.prof{display:flex;align-items:center;gap:12px;background:var(--sheet);border-radius:var(--r);box-shadow:0 5px 0 var(--shadow);padding:10px 14px;text-align:left;width:100%}
.prof b{font-family:var(--display);font-size:1.3rem;flex:1}
.prof small{color:var(--muted)}
.avatar{width:52px;height:52px;position:relative;display:grid;place-items:center;flex:none}
.avatar svg{position:absolute;inset:0;width:100%;height:100%}
.avatar span{position:relative;font-size:1.5rem}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:14px;border:3px solid rgba(127,127,160,.4);background:transparent;color:var(--ink)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{background:rgba(127,127,160,.15);border-radius:14px;padding:8px 12px;font-weight:800;border:3px solid transparent}
.choice[aria-pressed="true"]{border-color:var(--pink);background:rgba(255,79,163,.15)}
.choice.emoji{font-size:1.6rem;padding:4px 8px}
.label{font-weight:800;margin:4px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
.note{color:rgba(255,255,255,.85);font-size:.85rem;text-align:center}
#sig{text-align:center;font-family:var(--body);font-weight:800;font-size:.8rem;letter-spacing:.06em;color:rgba(255,255,255,.7);padding:0 16px max(14px,env(safe-area-inset-bottom,0px))}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<footer id="sig">2026@mrevers</footer>
<canvas id="confetti"></canvas>

<script>
(function(){
const ZOO_A=["🐸","🦊","🐻","🐼","🐨","🦁","🐯","🐰","🐶","🐱","🦄","🐙","🦉","🐧","🐢","🦋","🐳","🦒","🐘","🦔","🐞","🦜","🐿️","🦩"];
const ZOO_N=["Żabka","Lisek","Miś","Panda","Koala","Lew","Tygrys","Królik","Piesek","Kotek","Jednorożec","Ośmiorniczka","Sowa","Pingwin","Żółwik","Motyl","Wieloryb","Żyrafa","Słoń","Jeżyk","Biedronka","Papuga","Wiewiórka","Flaming"];
const PALETTES=[["#e8293f","#ffc928","#2f6cf6","#fff"],["#ff4fa3","#22c58b","#ffc928","#fff"],["#7b3fe4","#ff7a1a","#22c58b","#fff"],["#2f6cf6","#ff4fa3","#ffc928","#fff"],["#ff7a1a","#7b3fe4","#e8293f","#fff"],["#22c58b","#e8293f","#2f6cf6","#fff"]];
const ZOO_P=["Brawo!","Super!","Ekstra!","Mistrz!","Tak trzymaj!","Wow!","Świetnie!","Bomba!"];
const SPACE_A=["🌍","🌙","☀️","🪐","⭐","☄️","🌌","🚀","🛰️","🛸","👩‍🚀","🔭","🌑","🌕","🌠","💫","🪨","🌀","📡","⚛️","💎","🌋","🧑‍🚀","🌗"];
const SPACE_N=["Ziemia","Księżyc","Słońce","Saturn","Gwiazda","Kometa","Droga Mleczna","Rakieta","Satelita","UFO","Astronautka","Teleskop","Nów","Pełnia","Spadająca gwiazda","Mgławica","Asteroida","Czarna dziura","Radioteleskop","Atom","Kosmiczny kryształ","Olympus Mons","Astronauta","Kwadra Księżyca"];
const SPACE_P=["Czysto!","Kombo!","Bez pudła!","Mistrzowsko!","Level up!","Perfekcyjnie!","Tak jest!","Rakieta!"];
const TXT={maluch:{zoo:"Moje zoo",count:"zwierzątek",pick:"Twoje zwierzątko",got:"Nowe zwierzątko w Twoim zoo",hint:"a w zoo zamieszka nowe zwierzątko",intro:"Każda świetna runda (8 na 10 albo rekord na czas) przynosi nowe zwierzątko. Zbierzesz wszystkie?"},
 mistrz:{zoo:"Moja galaktyka",count:"odkryć",pick:"Twój znak",got:"Nowe odkrycie w Twojej galaktyce",hint:"a odkryjesz nowy obiekt w kosmosie",intro:"Każda świetna runda (8 na 10 albo rekord na czas) odkrywa nowy obiekt w kosmosie. Odkryjesz całą galaktykę?"}};
const RANKS=["Kadet","Pilot","Nawigator","Kapitan","Komandor","Admirał galaktyki"];
let ANIMALS=ZOO_A,NAMES=ZOO_N,PRAISE=ZOO_P,T=TXT.maluch;
function useSet(st){const m=st==="mistrz";ANIMALS=m?SPACE_A:ZOO_A;NAMES=m?SPACE_N:ZOO_N;PRAISE=m?SPACE_P:ZOO_P;T=TXT[m?"mistrz":"maluch"]}
/* older kids: neon hexagon badge instead of folk rosette */
function hexBadge(i){
  const p=PALETTES[i%PALETTES.length],h=(r,o)=>Array.from({length:6},(_,k)=>{const a=Math.PI/3*k+(o||0);return (50+Math.cos(a)*r).toFixed(1)+","+(50+Math.sin(a)*r).toFixed(1)}).join(" ");
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="${h(47,Math.PI/6)}" fill="${p[0]}"/><polygon points="${h(41,Math.PI/6)}" fill="#0d0d2b"/><polygon points="${h(41,0)}" fill="none" stroke="${p[1]}" stroke-width="2.5" opacity=".9"/><polygon points="${h(33,Math.PI/6)}" fill="none" stroke="${p[2]}" stroke-width="2"/></svg>`;
}
const KEY="wycinankowa-tabliczka-v1";
/* ===== USTAWIENIA SPRZEDAŻY ===== */
const SHOP_URL="https://buy.stripe.com/6oUeV6e2p6kF5jVc9Z5gc02";      // link płatności Stripe (Payment Link)
const PRICE="9,90 zł";
const FREE_MODES=["mul"];                                 // tryby dostępne za darmo
const TRIAL_DAYS=7;                                       // ile dni działa wersja próbna
const SALT="wt-2026-ludowa";                              // ten sam napis musi być w generator.html
function h32(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
const ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function sig(body){let h=h32(body+SALT),o="";for(let i=0;i<4;i++){o+=ABC[h%32];h=Math.floor(h/32)}return o}
function validCode(c){c=(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");return c.length===12&&[...c].every(ch=>ABC.includes(ch))&&sig(c.slice(0,8))===c.slice(8)}


/* folk paper-cut rosette (wycinanka) as SVG */
function rosette(i,petals,st){
  if((st||document.body.dataset.style)==="mistrz")return hexBadge(i);
  const p=PALETTES[i%PALETTES.length],n=petals||12;let s='<svg viewBox="0 0 100 100" aria-hidden="true">';
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2,x=50+Math.cos(a)*36,y=50+Math.sin(a)*36;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12" fill="${p[0]}"/>`}
  for(let k=0;k<n;k++){const a=(k+.5)/n*Math.PI*2,x=50+Math.cos(a)*30,y=50+Math.sin(a)*30;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="${p[1]}"/>`}
  s+=`<circle cx="50" cy="50" r="31" fill="${p[2]}"/><circle cx="50" cy="50" r="25" fill="${p[3]}"/>`;
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2,x=50+Math.cos(a)*28,y=50+Math.sin(a)*28;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="${p[0]}"/>`}
  return s+'</svg>';
}

/* ---------- storage ---------- */
function blank(name,animal,style){return{id:Date.now()+""+Math.random().toString(36).slice(2,6),name,animal,style,facts:{},zoo:[],bestTimed:0,bestStreak:0,rounds:[]}}
function sample(){
  const p=blank("Przykład: Ola",5,"maluch");p.example=true;
  for(let a=1;a<=10;a++)for(let b=a;b<=10;b++){if(a<=5||b<=3)p.facts[a+"x"+b]={c:a<=2?6:4,w:a*b>30?2:0};else if(a<=7&&b<=8)p.facts[a+"x"+b]={c:2,w:2}}
  p.zoo=[0,1,5,7,13];p.bestTimed=17;p.bestStreak=12;
  p.rounds=[{m:"Na czas",s:17,t:0,d:"10.11"},{m:"Mnożenie",s:9,t:10,d:"10.11"},{m:"Dzielenie",s:7,t:10,d:"09.11"}];
  return p;
}
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.profiles){db={profiles:[],current:null}}

if(!db.firstRun){db.firstRun=Date.now();save()}
const isFull=()=>!!db.unlocked;
const daysLeft=()=>Math.max(0,TRIAL_DAYS-Math.floor((Date.now()-db.firstRun)/864e5));
const canPlay=m=>isFull()||(FREE_MODES.includes(m)&&daysLeft()>0);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const me=()=>db.profiles.find(p=>p.id===db.current);

/* ---------- facts & mastery ---------- */
const fk=(a,b)=>Math.min(a,b)+"x"+Math.max(a,b);
function level(p,a,b){const f=p.facts[fk(a,b)];if(!f)return 0;const v=f.c-f.w*1.5;return v<0?1:v<1.5?2:v<3?3:v<5?4:5}
function pick(p){
  const pool=[];for(let a=1;a<=10;a++)for(let b=1;b<=10;b++){const l=level(p,a,b);pool.push([a,b,[3,6,5,3,1.5,.6][l]])}
  let t=pool.reduce((s,x)=>s+x[2],0)*Math.random();for(const x of pool){t-=x[2];if(t<=0)return x}return pool[0];
}
function makeQ(p,kind){
  const [a,b]=pick(p);const k=kind==="mix"?(Math.random()<.5?"mul":"div"):kind;
  return k==="mul"?{a,b,text:`${a} × ${b}`,ans:a*b,kind:"mul"}:{a,b,text:`${a*b} : ${a}`,ans:b,kind:"div"};
}

/* ---------- views ---------- */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function avatar(p,size){return `<span class="avatar" style="${size?`width:${size}px;height:${size}px`:""}">${rosette(p.animal,10,p.style)}<span>${(p.style==="mistrz"?SPACE_A:ZOO_A)[p.animal]}</span></span>`}
function setStyle(){const st=(me()&&me().style)||"maluch";document.body.dataset.style=st;useSet(st)}

function vProfiles(){
  document.body.dataset.style="maluch";useSet("maluch");
  app.innerHTML=`<div class="top"><h1>Wycinankowa Tabliczka</h1></div>
  <div class="scallop"></div><div class="sheet" style="margin-top:-1px">
   <h2 style="font-size:1.5rem;margin-bottom:10px">Kto dziś gra?</h2>
   <div class="profiles">${db.profiles.map(p=>`<button class="prof" data-id="${p.id}">${avatar(p)}<b>${esc(p.name)}</b><small>${p.zoo.length}/24 ${TXT[p.style==="mistrz"?"mistrz":"maluch"].count}</small></button>`).join("")}</div>
  </div>
  <button class="big" id="add">+ Nowy gracz</button>
  <p class="note">Wyniki zapisują się na tym telefonie. Bez konta i bez reklam.</p>`;
  app.querySelectorAll(".prof").forEach(b=>b.onclick=()=>{db.current=b.dataset.id;save();vHome()});

let G=null,timer=null;
function play(mode){
  if(!canPlay(mode))return vUnlock();
  const p=me();
  G={mode,kind:mode==="time"?"mix":mode,i:0,total:mode==="time"?Infinity:10,ok:0,streak:0,best:0,input:"",q:null,end:mode==="time"?Date.now()+60000:0,lock:false};
  next();
  if(mode==="time"){timer=setInterval(()=>{const left=Math.max(0,Math.ceil((G.end-Date.now())/1000));const el=document.getElementById("tl");if(el)el.textContent=left+" s";const bar=document.getElementById("bar");if(bar)bar.style.width=(left/60*100)+"%";if(left<=0)finish()},250)}
}
function next(){G.q=makeQ(me(),G.kind);G.input="";G.lock=false;vGame()}
function vGame(){
  const timed=G.mode==="time";
  app.innerHTML=`<div class="hud"><button class="back" aria-label="Zakończ">←</button>
   <div class="progress"><i id="bar" style="width:${timed?100:G.i/G.total*100}%"></i></div>
   <span class="pill" id="tl">${timed?Math.max(0,Math.ceil((G.end-Date.now())/1000))+" s":(G.i+1)+"/10"}</span><span class="pill">★ ${G.ok}</span></div>
  <div class="sheet q" id="qcard"><div class="expr">${G.q.text} = <span class="ans" id="ans">${G.input||"?"}</span></div>
   ${G.streak>=3?`<div style="color:var(--orange);font-weight:800;margin-top:6px">Seria: ${G.streak} z rzędu!</div>`:""}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join("")}
   <button class="key del" data-k="del" aria-label="Usuń">⌫</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok">OK</button></div>`;
  app.querySelector(".back").onclick=()=>{clearInterval(timer);vHome()};
  app.querySelectorAll(".key").forEach(b=>b.onclick=()=>press(b.dataset.k));
}
function press(k){
  if(!G||G.lock)return;
  if(k==="del")G.input=G.input.slice(0,-1);
  else if(k==="ok"){if(G.input)check();return}
  else if(G.input.length<3)G.input+=k;
  const a=document.getElementById("ans");if(a)a.textContent=G.input||"?";
  if(G.input.length>=String(G.q.ans).length&&+G.input===G.q.ans)check();
}
document.addEventListener("keydown",e=>{if(!G||!document.getElementById("qcard"))return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");else if(e.key==="Enter")press("ok")});

function check(){
  const p=me(),q=G.q,good=+G.input===q.ans,key=fk(q.a,q.b);
  p.facts[key]=p.facts[key]||{c:0,w:0};p.facts[key][good?"c":"w"]++;
  G.lock=true;
  if(good){G.ok++;G.streak++;G.best=Math.max(G.best,G.streak);showPop(G.mode==="time"?450:900,()=>advance())}
  else{G.streak=0;document.getElementById("qcard").classList.add("shake");setTimeout(()=>vFamily(q),350)}
  save();
}
function advance(){if(G.done)return;G.i++;if(G.mode!=="time"&&G.i>=G.total)finish();else if(G.mode==="time"&&Date.now()>=G.end)finish();else next()}
function showPop(ms,cb){

}

function finish(){
  if(G.done)return;G.done=true;clearInterval(timer);const p=me(),timed=G.mode==="time";
  const names={mul:"Mnożenie",div:"Dzielenie",mix:"Mieszane",time:"Na czas"};

  if(won){const free=ANIMALS.map((_,i)=>i).filter(i=>!p.zoo.includes(i));if(free.length){newAnimal=free[Math.floor(Math.random()*free.length)];p.zoo.push(newAnimal)}}
  const d=new Date();p.rounds.unshift({m:names[G.mode],s:G.ok,t:timed?0:10,d:String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")});p.rounds=p.rounds.slice(0,30);save();

  app.innerHTML=`<div class="sheet result">

   <p style="margin:0;color:var(--muted)">${timed?`Twój rekord: ${p.bestTimed}. `:""}Najdłuższa seria: ${G.best}</p>
   ${newAnimal!==null?`<div class="rosette" style="margin-top:6px">${rosette(newAnimal)}<span class="animal">${ANIMALS[newAnimal]}</span></div><p style="margin:0;font-weight:800">${T.got}: ${NAMES[newAnimal]}!</p>`:`<p style="margin:0">${timed?"Zdobądź 15 punktów albo pobij rekord":"Zdobądź 8 na 10"}, ${T.hint}.</p>`}
  </div>
  <button class="big" id="again">Jeszcze raz</button><button class="big alt" id="home">Menu</button>`;
  app.querySelector("#again").onclick=()=>play(G.mode);app.querySelector("#home").onclick=vHome;
  if(won||record)confetti();
}

/* ---------- confetti: paper-cut circles ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.getElementById("confetti"),cx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#e8293f","#ffc928","#2f6cf6","#ff4fa3","#22c58b","#7b3fe4","#ff7a1a"];
  const ps=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,r:4+Math.random()*7,vy:2+Math.random()*3,vx:-1+Math.random()*2,c:cols[Math.floor(Math.random()*cols.length)],p:Math.random()*6}));
  let t=0;(function f(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(o=>{o.y+=o.vy;o.x+=o.vx+Math.sin(t/10+o.p);cx.fillStyle=o.c;cx.beginPath();cx.arc(o.x,o.y,o.r,0,7);cx.fill()});t++;if(t<200)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})();
}

  if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null});return}
  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const steps=ios?[["1","Otwórz tę stronę w <b>Safari</b>."],["2","Stuknij <b>☰</b> (trzy kreski) obok adresu strony na dole ekranu, a potem <b>Udostępnij</b>. W starszych iPhone'ach przycisk Udostępnij (kwadrat ze strzałką) jest od razu na dole."],["3","Przesuń panel w górę i wybierz <b>Do ekranu początkowego</b>. Nie widzisz jej? Stuknij na dole <b>Edycja czynności</b> i dodaj ją zielonym plusem."],["4","Stuknij <b>Dodaj</b>. Ikona Tabliczki pojawi się na ekranie."]]
   :[["1","Otwórz tę stronę w <b>Chrome</b>."],["2","Stuknij <b>⋮</b> (trzy kropki) w prawym górnym rogu."],["3","Wybierz <b>Zainstaluj aplikację</b> albo <b>Dodaj do ekranu głównego</b>."],["4","Potwierdź. Ikona Tabliczki pojawi się na ekranie."]];
  app.innerHTML=`<div class="top"><button class="back" aria-label="Wróć">←</button><h1>Ikona na ekranie</h1></div>
  <div class="sheet" style="display:flex;flex-direction:column;gap:14px">
   <p style="margin:0;font-size:1.1rem">Dodaj Tabliczkę do ekranu głównego, a będzie się otwierać jak zwykła aplikacja, także bez internetu.</p>
   ${steps.map(s=>`<div style="display:flex;gap:12px;align-items:flex-start"><span style="flex:none;width:36px;height:36px;border-radius:50%;background:var(--yellow);color:#1d1b2e;display:grid;place-items:center;font-family:var(--display);font-weight:800">${s[0]}</span><p style="margin:4px 0 0;font-size:1.05rem">${s[1]}</p></div>`).join("")}
   <p style="margin:0;color:var(--muted);font-size:.95rem">To nie jest konieczne. Tabliczka działa też zwyczajnie w przeglądarce, wystarczy zapisać stronę w zakładkach.</p><button class="big" id="ok">Rozumiem</button></div>`;
  const back=()=>me()?vHome():vProfiles();app.querySelector(".back").onclick=back;app.querySelector("#ok").onclick=back;
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
